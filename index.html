<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpresa para Rayane</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lock-screen">
        <div class="lock">🔒</div>
        <h1>Falta pouco, Rayane!</h1>
        <div id="countdown"></div>
    </div>

    <div id="main-content" class="hidden">
        <h1>Feliz Aniversário, Rayane! 🎉❤️</h1>
        <p>Eu te amo muito! é pra gostar dessa surpresa em!</p>

        
        <div id="special-text" class="hidden">
            <p>Desde que você entrou na minha vida, tudo ficou mais bonito. 🌸</p>
            <p>Você é o meu amor, minha melhor amiga e minha razão de sorrir. ❤️</p>
            <p>Só felicidade pra você amor quero voce pra sempre✨</p>
        </div>

        <button id="reveal-button">Revelar Surpresa 🎁</button>

        <div class="gallery hidden">
            <img src="img1.jpeg" alt="Rayane 1" class="photo">
            <img src="img4.jpeg" alt="Rayane 2" class="photo">
            <img src="img3.jpeg" alt="Rayane 3" class="photo">
            
        </div>

    </div>

    <audio id="background-music" src="videoplayback.weba" loop></audio>

    <canvas id="hearts"></canvas>

    <script src="script.js"></script>
</body>
</html>
